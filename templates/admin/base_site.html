{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
    {{ block.super }}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            corePlugins: {
                preflight: false,
            },
            theme: {
                extend: {
                    colors: {
                        'uni-orange': '#FF5F1F',
                        'uni-cream': '#F9F9F7',
                        'uni-black': '#1A1A1A',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Use Django's built-in CSS variables to natively support Dark Mode */
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #header h1 a {
            color: var(--header-link-color, #1A1A1A);
            text-decoration: none;
        }
        #header h1 a:hover {
            color: #FF5F1F;
        }
        a {
            color: #FF5F1F;
            text-decoration: none;
        }
        a:hover {
            color: var(--body-fg);
        }
        #nav-sidebar li a:hover {
            background-color: var(--selected-bg);
            border-left-color: #FF5F1F;
            color: #FF5F1F;
        }
    </style>
{% endblock %}

{% block title %}UniCart Admin | {{ block.super }}{% endblock %}

{% block branding %}
    <h1 id="site-name">
        <a href="{% url 'admin:index' %}">
            <span style="font-weight: 800; font-size: 1.5rem; color: var(--header-link-color);">UniCart</span>
            <span style="color: #FF5F1F; font-size: 0.75rem; font-weight: 700; margin-left: 0.5rem;">Admin</span>
        </a>
    </h1>
{% endblock %}
